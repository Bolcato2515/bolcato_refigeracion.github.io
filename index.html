<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; padding: 2rem; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); max-width: 80%; }
        .container img { max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 1.5rem; }
        h1 { color: #2b6cb0; margin-bottom: 0.5rem; }
        p { line-height: 1.6; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <img src="imagenportada.jpg" alt="Imagen de portada">
        <h1>¡Bienvenido a mi sitio web!</h1>
        <p>Esta página fue creada de forma totalmente gratuita usando GitHub Pages.</p>
    </div>
</body>
</html>
